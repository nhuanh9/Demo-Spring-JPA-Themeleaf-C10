<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách danh mục</title>
</head>
<body>
<h1>Danh sách danh mục</h1>
<a href="/categories/add">Thêm danh mục mới</a> | 
<a href="/products">Quản lý sản phẩm</a>
<br><br>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Tên danh mục</th>
            <th>Hành động</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td>
                <a th:href="@{/categories/edit/{id}(id=${c.id})}">Sửa</a> | 
                <a th:href="@{/categories/delete/{id}(id=${c.id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
