    <!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa sản phẩm</title>
</head>
<body>
<h1>Sửa sản phẩm</h1>
<form action="/products/update" method="post">
    <input type="hidden" name="id" th:value="${product.id}">
    
    Tên: <input type="text" name="name" th:value="${product.name}" required>
    Giá: <input type="number" name="price" step="0.01" th:value="${product.price}" required>
    
    Danh mục: 
    <select name="categoryId" required>
        <option th:each="c : ${categories}" 
                th:value="${c.id}" 
                th:text="${c.name}"
                th:selected="${product.category != null and product.category.id == c.id}"></option>
    </select>
    
    <button type="submit">Lưu</button>
</form>
<br>
<a href="/products">Quay lại danh sách</a>
</body>
</html>
