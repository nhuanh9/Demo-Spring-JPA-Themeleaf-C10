<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Category CRUD</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Category CRUD</h1>
    <a href="/product-crud.html">Go to Product CRUD</a>
    <hr>
    
    <!-- Search & Sort -->
    <div>
        <input type="text" id="search" placeholder="Search by name...">
        <select id="sortBy">
            <option value="id">Sort by ID</option>
            <option value="name">Sort by Name</option>
        </select>
        <select id="sortDirection">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </select>
        <button onclick="loadCategories()">Apply</button>
    </div>
    
    <hr>
    
    <!-- Form -->
    <div>
        <input type="hidden" id="categoryId">
        <input type="text" id="categoryName" placeholder="Category name">
        <button id="btnSave" onclick="saveCategory()">Save</button>
        <button id="btnCancel" onclick="cancelEdit()" style="display:none;">Cancel</button>
    </div>
    
    <hr>
    
    <!-- List -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="categoryTableBody">
            <!-- Data loaded dynamically -->
        </tbody>
    </table>

    <script>
        const API_URL = '/api/categories';
        
        async function loadCategories() {
            const search = document.getElementById('search').value;
            const sortBy = document.getElementById('sortBy').value;
            const sortDirection = document.getElementById('sortDirection').value;
            
            try {
                const response = await axios.get(API_URL, {
                    params: { search, sortBy, sortDirection }
                });
                const categories = response.data;
                const tbody = document.getElementById('categoryTableBody');
                tbody.innerHTML = '';
                categories.forEach(c => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${c.id}</td>
                            <td>${c.name}</td>
                            <td>
                                <button onclick="editCategory(${c.id}, '${c.name}')">Edit</button>
                                <button onclick="deleteCategory(${c.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                alert('Error loading categories');
            }
        }
        
        async function saveCategory() {
            const id = document.getElementById('categoryId').value;
            const name = document.getElementById('categoryName').value;
            
            try {
                if (id) {
                    // Update
                    await axios.put(`${API_URL}/${id}`, { name });
                } else {
                    // Create
                    await axios.post(API_URL, { name });
                }
                cancelEdit();
                loadCategories();
            } catch (error) {
                console.error(error);
                alert('Error saving category');
            }
        }
        
        function editCategory(id, name) {
            document.getElementById('categoryId').value = id;
            document.getElementById('categoryName').value = name;
            document.getElementById('btnSave').innerText = 'Update';
            document.getElementById('btnCancel').style.display = 'inline-block';
        }
        
        function cancelEdit() {
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryName').value = '';
            document.getElementById('btnSave').innerText = 'Save';
            document.getElementById('btnCancel').style.display = 'none';
        }
        
        async function deleteCategory(id) {
            if (confirm('Are you sure you want to delete this category?')) {
                try {
                    await axios.delete(`${API_URL}/${id}`);
                    loadCategories();
                } catch (error) {
                    console.error(error);
                    alert('Error deleting category');
                }
            }
        }
        
        // Initial load
        loadCategories();
    </script>
</body>
</html>
